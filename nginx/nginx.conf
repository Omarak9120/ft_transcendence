# Temporary HTTP configuration (SSL disabled for testing)
server {
    listen 80;
    server_name localhost;

    # Backend API (must come before / location)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth POST routes only (form submissions go to backend)
    location /login {
        if ($request_method = POST) {
            proxy_pass http://backend:3000;
            break;
        }
        proxy_pass http://frontend:80;
    }
    
    location /signup {
        if ($request_method = POST) {
            proxy_pass http://backend:3000;
            break;
        }
        proxy_pass http://frontend:80;
    }

    # WebSocket support (must come before / location)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend - serve static files and handle SPA routing (catch-all, comes last)
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
